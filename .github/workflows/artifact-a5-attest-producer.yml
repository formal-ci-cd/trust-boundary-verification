# actions/attestで報告された成果物汚染の構造を，無害な入力で簡略化した保存側．
name: GHA-A5 actions-attest style untrusted producer

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rebuild-dist:
    name: Build PR-controlled dist artifact
    runs-on: ubuntu-latest

    steps:
      # PR側のfileを読むため，認証情報はgit設定へ残さない．
      - name: Checkout pull request content
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 実在脆弱性と同様に，成果物の中へ対象branchとdistを一緒に入れる．
      # ここで使うdistは無害な研究用markerであり，実行もしない．
      - name: Prepare PR-controlled artifact
        run: |
          set -eu
          mkdir -p .research-a5-output/dist .research-a5-output/dist-meta
          cp .research-artifact-a5-input/dist/index.js .research-a5-output/dist/index.js
          cp .research-artifact-a5-input/head-ref.txt .research-a5-output/dist-meta/head-ref
          cp .research-artifact-a5-input/head-sha.txt .research-a5-output/dist-meta/head-sha

      - name: Upload rebuilt dist and metadata
        id: upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gha-a5-rebuilt-dist
          path: .research-a5-output
          if-no-files-found: error
          retention-days: 1

      - name: Record producer result
        run: |
          {
            echo '### GHA-A5 保存側の実験結果'
            echo
            echo 'producer_untrusted=true'
            echo 'artifact_write_succeeded=true'
            echo "artifact_id=${{ steps.upload-artifact.outputs.artifact-id }}"
            echo "artifact_digest=${{ steps.upload-artifact.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
