name: Workflow model v2 regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build isolated analysis environment
        run: docker build --platform linux/amd64 -t research-validation .

      # 原本workflowや外部Actionは実行せず，v2の回帰テストを行う．
      # 段階的なNuSMV評価は docs/container-guide.md を参照する．
      - name: Test workflow model v2
        run: |
          docker run --rm --platform linux/amd64 --network none --read-only --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            --memory 2g --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,nosuid,nodev,size=512m \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/repo:ro" -w /repo research-validation \
            python3 -m unittest discover -s tests -v
