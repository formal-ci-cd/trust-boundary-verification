# PR由来のArtifactを取得し，内容を読み取る到達例．
name: Artifact Consumer
on:
  workflow_run:
    workflows: [Artifact Producer]
    types: [completed]
permissions:
  actions: read
jobs:
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: payload
          path: payload
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - run: value=$(tr -d '\r\n' < "$ARTIFACT_FILE")
        env:
          ARTIFACT_FILE: payload/payload.txt
