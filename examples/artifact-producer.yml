# PRから取得したファイルを，変更せずArtifactとして保存する．
name: Artifact Producer
on: pull_request
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: payload
          path: examples/payload.txt
