name: Artifact Consumer
on: push
permissions: {actions: read, contents: write}
jobs:
  upload:
    outputs: {enabled: "${{ steps.flag.outputs.enabled }}"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: pr-head, persist-credentials: false}
      - id: flag
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: {name: local, path: data}
  read:
    needs: upload
    if: needs.upload.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: local
          path: data
      - run: cat data
      - run: git add data
      - run: git push
