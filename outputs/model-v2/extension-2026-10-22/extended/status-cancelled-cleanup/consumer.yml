name: Restore
on: push
permissions: {contents: write}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: linux-pkg-current
          restore-keys: linux-pkg-
          path: data
      - run: cat data
      - if: cancelled()
        run: git add data
      - if: cancelled()
        run: git push
