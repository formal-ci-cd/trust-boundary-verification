name: Restore
on: push
permissions: {contents: write}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: linux-pkg-new
          restore-keys: linux-pkg-
          path: data
      - run: cat data
      - run: git add data
      - run: git push
