name: Restore
on: push
permissions: {contents: write}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - id: cache
        uses: actions/cache/restore@v4
        with:
          key: different-current
          restore-keys: different-
          path: data
      - run: cat data
      - run: git add data
      - run: git push
